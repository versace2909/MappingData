services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: mims_timescaledb
    environment:
      POSTGRES_DB: mims
      POSTGRES_USER: mims_user
      POSTGRES_PASSWORD: mims_password
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mims_user -d mims"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.8
    container_name: mims_localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls s3://mims-data-sources 2>&1 | grep -q '' && echo OK"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
